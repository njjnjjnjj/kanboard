[package]
name = "kanboard"
version = "0.4.0"
description = "A quiet personal kanban board"
authors = ["kanboard"]
edition = "2021"

[lib]
name = "local_kanban_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["clock", "serde"] }
open = "5"
rmcp = { version = "3.4", features = ["server", "transport-streamable-http-server", "transport-streamable-http-server-session"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync"] }
tokio-util = "0.7"
url = "2"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

[dev-dependencies]
rmcp = { version = "3.4", features = ["client", "transport-streamable-http-client-reqwest"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
