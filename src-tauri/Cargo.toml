[package]
name = "local-kanban"
version = "0.1.0"
description = "A quiet personal kanban board"
authors = ["local"]
edition = "2021"

[lib]
name = "local_kanban_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
